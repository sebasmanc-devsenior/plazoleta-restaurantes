spring.application.name=plazoleta
# Carga opcional de un archivo .env local (copie .env.example a .env). Las variables de
# entorno del sistema siempre tienen prioridad sobre este archivo.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plazoleta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secretos obligatorios: la aplicación no arranca si faltan.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=3600000
app.internal.token=${USERS_INTERNAL_TOKEN}

app.users.base-url=${USERS_SERVICE_BASE_URL:http://localhost:8081}
