# Configuración de pruebas: base de datos H2 en memoria con compatibilidad MySQL,
# para que los tests de integración no dependan de un MySQL local.
spring.datasource.url=jdbc:h2:mem:plazoleta;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=test-only-secret-key-with-at-least-32-bytes!!
app.jwt.expiration-ms=3600000
app.internal.token=test-internal-token
app.users.base-url=http://localhost:1
